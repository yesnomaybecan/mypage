<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body id="gallery-page">
    <header class="site-header">
        <h1 class="site-title">Фотогалерея</h1>
        <nav class="main-nav">
            <a href="../index.html" class="nav-link">Головна</a>
            <a href="gallery.html" class="nav-link">Галерея</a>
            <a href="contact.html" class="nav-link">Контакти</a>
        </nav>
    </header>
    <main class="content">
        <section id="buddy-gallery" class="content-section">
            <h2 class="section-title">Фотографії Бадді</h2>
            <div class="gallery-grid">
                <figure class="gallery-item">
                    <img src="../photo/buddy.jpg" alt="Бадді" class="pet-image">
                    <figcaption>Мій собака Бадді</figcaption>
                </figure>
                <figure class="gallery-item">
                    <img src="../photo/buddy2.jpg" alt="Бадді на прогулянці" class="pet-image">
                    <figcaption>Бадді на прогулянці</figcaption>
                </figure>
            </div>
        </section>
        <section id="luna-gallery" class="content-section">
            <h2 class="section-title">Фотографії Луни</h2>
            <div class="gallery-grid">
                <figure class="gallery-item">
                    <img src="../photo/luna.jpg" alt="Луна" class="pet-image">
                    <figcaption>Моя кішка Луна</figcaption>
                </figure>
                <figure class="gallery-item">
                    <img src="../photo/luna2.jpg" alt="Луна вдома" class="pet-image">
                    <figcaption>Луна вдома</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer class="site-footer">
        <p>© 2026 Мої улюбленці</p>
    </footer>
</body>
</html>
